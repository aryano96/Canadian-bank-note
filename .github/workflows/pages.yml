name: Deploy demo to GitHub Pages

# Builds the static, server-less demo (the game runs in the browser) and
# publishes it at https://aryano96.github.io/Canadian-bank-note/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:demo
      - run: cp apps/web/dist-demo/demo.html apps/web/dist-demo/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
